<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="360" viewBox="0 0 1000 360" fill="none" role="img" aria-label="status now">
  <defs>
    <linearGradient id="nowin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0e1116"/><stop offset="1" stop-color="#07090c"/>
    </linearGradient>
    <clipPath id="nowround"><rect x="8" y="8" width="984" height="344" rx="12"/></clipPath>
    <style>
      .mono{font-family:'JetBrains Mono','Fira Code',ui-monospace,Consolas,monospace}
      .cur{animation:blink 1s steps(1) infinite}@keyframes blink{50%{opacity:0}}
      .r{opacity:0;animation:show .01s linear forwards}@keyframes show{to{opacity:1}}
      .live{animation:pulse 1.6s ease-in-out infinite}@keyframes pulse{50%{opacity:.25}}
      .chk{stroke-dasharray:22;stroke-dashoffset:22;animation:draw .5s ease forwards}
      @keyframes draw{to{stroke-dashoffset:0}}
    </style>
  </defs>
  <rect x="8" y="8" width="984" height="344" rx="12" fill="url(#nowin)" stroke="#ff2d4b" stroke-opacity="0.35"/>
  <g clip-path="url(#nowround)">
    <rect x="8" y="8" width="984" height="38" fill="#12161c"/>
    <circle cx="34" cy="27" r="6" fill="#ff5f56"/><circle cx="56" cy="27" r="6" fill="#ffbd2e"/><circle cx="78" cy="27" r="6" fill="#27c93f"/>
    <text x="500" y="32" text-anchor="middle" class="mono" font-size="14" fill="#7d8794">raju@redteam: /proc/now</text>

    <g class="mono">
      <text x="30" y="76" font-size="14" fill="#5b6570"><tspan fill="#ff2d4b">➜</tspan> <tspan fill="#c9d1d9">cat /proc/now</tspan><tspan class="cur" fill="#ff2d4b">▊</tspan></text>

      <!-- status -->
      <circle cx="36" cy="103" r="5" fill="#3fb950" class="live"/>
      <text x="50" y="108" font-size="15" fill="#6ea8fe">status<tspan fill="#5b6570"> :</tspan> <tspan fill="#3fb950">online — available for work</tspan></text>

      <!-- two columns -->
      <!-- left: working on -->
      <text x="30" y="146" font-size="14" fill="#ff8a8a" letter-spacing="1">▍ WORKING ON</text>
      <g font-size="13.5" fill="#c9d1d9">
        <text class="r" style="animation-delay:.3s" x="40" y="172"><tspan fill="#3fb950">▹</tspan> Offensive security assessments · QOS Technology</text>
        <text class="r" style="animation-delay:.6s" x="40" y="196"><tspan fill="#3fb950">▹</tspan> Bug hunting across web applications &amp; APIs</text>
        <text class="r" style="animation-delay:.9s" x="40" y="220"><tspan fill="#3fb950">▹</tspan> Turning research &amp; findings into write-ups</text>
      </g>

      <!-- focus chips -->
      <text x="30" y="256" font-size="14" fill="#ff8a8a" letter-spacing="1">▍ FOCUS</text>
      <g font-size="12" class="r" style="animation-delay:1.1s">
        <rect x="40" y="268" width="98" height="24" rx="5" fill="#161b22" stroke="#ff2d4b" stroke-opacity="0.4"/><text x="54" y="284" fill="#c9d1d9">red-teaming</text>
        <rect x="148" y="268" width="90" height="24" rx="5" fill="#161b22" stroke="#ff2d4b" stroke-opacity="0.4"/><text x="162" y="284" fill="#c9d1d9">web &amp; api</text>
        <rect x="248" y="268" width="78" height="24" rx="5" fill="#161b22" stroke="#ff2d4b" stroke-opacity="0.4"/><text x="262" y="284" fill="#c9d1d9">android</text>
        <rect x="336" y="268" width="120" height="24" rx="5" fill="#161b22" stroke="#ff2d4b" stroke-opacity="0.4"/><text x="350" y="284" fill="#c9d1d9">security-research</text>
      </g>

      <!-- right: roadmap -->
      <text x="540" y="146" font-size="14" fill="#ff8a8a" letter-spacing="1">▍ ROADMAP — NEXT</text>
      <g font-size="13" fill="#c9d1d9">
        <rect x="550" y="160" width="14" height="14" rx="3" fill="none" stroke="#3f4753"/>
        <text x="576" y="172">Advanced hands-on offensive cert</text>

        <rect x="550" y="188" width="14" height="14" rx="3" fill="none" stroke="#3f4753"/>
        <text x="576" y="200">Follow-up web-vuln research paper</text>

        <rect x="550" y="216" width="14" height="14" rx="3" fill="none" stroke="#3f4753"/>
        <text x="576" y="228">Open-source my testing automation</text>

        <!-- in progress -->
        <rect x="550" y="244" width="14" height="14" rx="3" fill="none" stroke="#ffbd2e"/>
        <path d="M553 251 l3 3 l5 -6" fill="none" stroke="#ffbd2e" stroke-width="2" class="chk" style="animation-delay:1.8s"/>
        <text x="576" y="256" fill="#e6c07a">Hall-of-fame responsible disclosures</text>
        <text x="576" y="276" font-size="11" fill="#7d8794">in progress…</text>
      </g>

      <text x="30" y="330" font-size="12.5" class="r" style="animation-delay:2.1s" fill="#ff2d4b">[✓] uptime: 2+ yrs in cybersecurity · last commit: today</text>
    </g>
  </g>
</svg>
