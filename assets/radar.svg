<svg xmlns="http://www.w3.org/2000/svg" width="320" height="320" viewBox="0 0 320 320" fill="none" role="img" aria-label="attack surface radar">
  <defs>
    <radialGradient id="rbg" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#0d1a10"/>
      <stop offset="1" stop-color="#060a07"/>
    </radialGradient>
    <linearGradient id="sweep" x1="0.5" y1="0.5" x2="1" y2="0.5" gradientUnits="objectBoundingBox">
      <stop offset="0" stop-color="#3fb950" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#3fb950" stop-opacity="0"/>
    </linearGradient>
    <style>.mono{font-family:'JetBrains Mono',ui-monospace,Consolas,monospace;font-size:11px;fill:#8fd7a0}</style>
  </defs>

  <circle cx="160" cy="160" r="150" fill="url(#rbg)" stroke="#1f7a33" stroke-opacity="0.5"/>
  <g stroke="#3fb950" stroke-opacity="0.28" fill="none">
    <circle cx="160" cy="160" r="110"/>
    <circle cx="160" cy="160" r="72"/>
    <circle cx="160" cy="160" r="34"/>
    <line x1="10" y1="160" x2="310" y2="160"/>
    <line x1="160" y1="10" x2="160" y2="310"/>
  </g>

  <!-- rotating sweep -->
  <g>
    <path d="M160 160 L160 10 A150 150 0 0 1 290 85 Z" fill="url(#sweep)"/>
    <line x1="160" y1="160" x2="160" y2="10" stroke="#3fb950" stroke-width="1.5"/>
    <animateTransform attributeName="transform" type="rotate" from="0 160 160" to="360 160 160" dur="4s" repeatCount="indefinite"/>
  </g>

  <!-- blips -->
  <g fill="#ff5d5d">
    <circle cx="205" cy="95" r="4"><animate attributeName="opacity" values="0;1;0.2" dur="4s" begin="0.4s" repeatCount="indefinite"/></circle>
    <circle cx="110" cy="120" r="4"><animate attributeName="opacity" values="0;1;0.2" dur="4s" begin="1.3s" repeatCount="indefinite"/></circle>
    <circle cx="230" cy="200" r="4"><animate attributeName="opacity" values="0;1;0.2" dur="4s" begin="2.1s" repeatCount="indefinite"/></circle>
    <circle cx="95" cy="215" r="4"><animate attributeName="opacity" values="0;1;0.2" dur="4s" begin="2.9s" repeatCount="indefinite"/></circle>
    <circle cx="160" cy="60" r="4"><animate attributeName="opacity" values="0;1;0.2" dur="4s" begin="3.5s" repeatCount="indefinite"/></circle>
  </g>
  <g class="mono">
    <text x="212" y="92">web</text>
    <text x="60" y="120">android</text>
    <text x="236" y="220">wi-fi</text>
    <text x="60" y="230">infra</text>
    <text x="168" y="56">api</text>
  </g>
  <circle cx="160" cy="160" r="4" fill="#3fb950"/>
</svg>
