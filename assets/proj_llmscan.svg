<svg xmlns="http://www.w3.org/2000/svg" width="500" height="208" viewBox="0 0 500 208" fill="none" role="img" aria-label="LLMScan">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0e1116"/><stop offset="1" stop-color="#08090c"/></linearGradient>
    <linearGradient id="sh" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#6ea8fe" stop-opacity="0"/><stop offset="0.5" stop-color="#6ea8fe" stop-opacity="0.10"/><stop offset="1" stop-color="#6ea8fe" stop-opacity="0"/></linearGradient>
    <clipPath id="cl"><rect x="2" y="2" width="496" height="204" rx="12"/></clipPath>
    <style>
      .mono{font-family:'JetBrains Mono','Fira Code',ui-monospace,Consolas,monospace}
      .dot{animation:pulse 1.6s ease-in-out infinite}@keyframes pulse{50%{opacity:.3}}
      .chip{opacity:0;animation:fin .5s ease .6s forwards}@keyframes fin{to{opacity:1}}
      .brd{animation:brd 3s ease-in-out infinite}@keyframes brd{50%{stroke-opacity:.7}}
    </style>
  </defs>
  <rect x="2" y="2" width="496" height="204" rx="12" fill="url(#bg)"/>
  <g clip-path="url(#cl)">
    <rect x="2" y="2" width="6" height="204" fill="#6ea8fe" opacity="0.9"/>
    <g><circle cx="31" cy="41" r="6.5" fill="none" stroke="#6ea8fe" stroke-width="2"/><line x1="36" y1="46" x2="42" y2="52" stroke="#6ea8fe" stroke-width="2.2" stroke-linecap="round"/></g>
    <text x="66" y="40" class="mono" font-size="17" font-weight="700" fill="#6ea8fe">LLMScan</text>
    <text x="66" y="58" class="mono" font-size="11" fill="#6e7681">github.com/raju4199/LLM_Tools</text>
    <circle cx="430" cy="34" r="4" fill="#3fb950" class="dot"/>
    <text x="442" y="38" class="mono" font-size="10.5" fill="#7d8794">OPEN SOURCE</text>
    <text x="28" y="96" class="mono" font-size="12.5" fill="#c9d1d9">The Nikto for Large Language Models — an</text><text x="28" y="118" class="mono" font-size="12.5" fill="#c9d1d9">open-source CLI that probes any LLM endpoint</text><text x="28" y="140" class="mono" font-size="12.5" fill="#c9d1d9">for vulnerabilities and reports the findings.</text>
    <g class="chip"><rect x="28" y="176" width="64" height="22" rx="5" fill="#161b22" stroke="#6ea8fe" stroke-opacity="0.35"/><text x="60" y="191" text-anchor="middle" class="mono" font-size="11" fill="#adbac7">Python</text><rect x="100" y="176" width="101" height="22" rx="5" fill="#161b22" stroke="#6ea8fe" stroke-opacity="0.35"/><text x="151" y="191" text-anchor="middle" class="mono" font-size="11" fill="#adbac7">AI Security</text><rect x="210" y="176" width="131" height="22" rx="5" fill="#161b22" stroke="#6ea8fe" stroke-opacity="0.35"/><text x="275" y="191" text-anchor="middle" class="mono" font-size="11" fill="#adbac7">LLM Red Teaming</text></g>
    <rect x="-160" y="2" width="130" height="204" fill="url(#sh)" transform="skewX(-16)"><animate attributeName="x" values="-160;540" dur="3s" begin="0.8s" repeatCount="indefinite"/></rect>
  </g>
  <rect x="2.5" y="2.5" width="495" height="203" rx="12" fill="none" stroke="#6ea8fe" stroke-opacity="0.35" class="brd"/>
</svg>
