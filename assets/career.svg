<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="400" viewBox="0 0 1000 400" fill="none" role="img" aria-label="career log">
  <defs>
    <linearGradient id="cwin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0e1116"/><stop offset="1" stop-color="#07090c"/>
    </linearGradient>
    <clipPath id="cround"><rect x="8" y="8" width="984" height="384" rx="12"/></clipPath>
    <style>
      .mono{font-family:'JetBrains Mono','Fira Code',ui-monospace,Consolas,monospace}
      .cur{animation:blink 1s steps(1) infinite}@keyframes blink{50%{opacity:0}}
      .row{opacity:0;animation:show .01s linear forwards}
      @keyframes show{to{opacity:1}}
    </style>
  </defs>
  <rect x="8" y="8" width="984" height="384" rx="12" fill="url(#cwin)" stroke="#ff2d4b" stroke-opacity="0.35"/>
  <g clip-path="url(#cround)">
    <rect x="8" y="8" width="984" height="38" fill="#12161c"/>
    <circle cx="34" cy="27" r="6" fill="#ff5f56"/><circle cx="56" cy="27" r="6" fill="#ffbd2e"/><circle cx="78" cy="27" r="6" fill="#27c93f"/>
    <text x="500" y="32" text-anchor="middle" class="mono" font-size="14" fill="#7d8794">raju@redteam: ~/.history</text>

    <g class="mono" font-size="14.5">
      <text x="30" y="78" fill="#5b6570"><tspan fill="#ff2d4b">➜</tspan> <tspan fill="#6ea8fe">~</tspan> <tspan fill="#c9d1d9">cat career.log --pretty</tspan><tspan class="cur" fill="#ff2d4b">▊</tspan></text>

      <!-- entry: Analyst -->
      <g class="row" style="animation-delay:.3s">
        <text x="30" y="112"><tspan fill="#3fb950">2025-06 → now</tspan></text>
        <text x="190" y="112" fill="#f0f6fc" font-weight="700">Cyber Security Analyst</text>
        <text x="470" y="112" fill="#ff8a8a">QOS Technology Pvt. Ltd.</text>
        <text x="190" y="132" fill="#7d8794" font-size="13">└─ Offensive security assessments &amp; security research</text>
      </g>
      <!-- entry: Intern -->
      <g class="row" style="animation-delay:.8s">
        <text x="30" y="164"><tspan fill="#3fb950">2025-04 → 05</tspan></text>
        <text x="190" y="164" fill="#f0f6fc" font-weight="700">Cyber Security Intern</text>
        <text x="470" y="164" fill="#ff8a8a">QOS Technology Pvt. Ltd.</text>
        <text x="190" y="184" fill="#7d8794" font-size="13">└─ Promoted to Analyst after two months</text>
      </g>
      <!-- entry: Research -->
      <g class="row" style="animation-delay:1.3s">
        <text x="30" y="216"><tspan fill="#3fb950">2024</tspan></text>
        <text x="190" y="216" fill="#f0f6fc" font-weight="700">Published Research</text>
        <text x="470" y="216" fill="#ff8a8a">ResearchGate</text>
        <text x="190" y="236" fill="#7d8794" font-size="13">└─ "Web Based Vulnerabilities Modulation"</text>
      </g>
      <!-- entry: CEH -->
      <g class="row" style="animation-delay:1.8s">
        <text x="30" y="268"><tspan fill="#3fb950">2023</tspan></text>
        <text x="190" y="268" fill="#f0f6fc" font-weight="700">CEH v12 — Certified Ethical Hacker</text>
        <text x="620" y="268" fill="#ff8a8a">EC-Council</text>
      </g>
      <!-- entry: hackathons -->
      <g class="row" style="animation-delay:2.2s">
        <text x="30" y="300"><tspan fill="#3fb950">2023</tspan></text>
        <text x="190" y="300" fill="#f0f6fc" font-weight="700">National Hackathon Circuit</text>
        <text x="470" y="300" fill="#7d8794" font-size="13">KAVACH · Intel oneAPI × IIT Roorkee · SIH</text>
      </g>
      <!-- entry: degree -->
      <g class="row" style="animation-delay:2.6s">
        <text x="30" y="332"><tspan fill="#3fb950">2020 → 2024</tspan></text>
        <text x="190" y="332" fill="#f0f6fc" font-weight="700">B.E. CSE — Information Security</text>
        <text x="620" y="332" fill="#ff8a8a">Chandigarh University</text>
        <text x="190" y="352" fill="#7d8794" font-size="13">└─ Gold Medal · Academic Excellence Award</text>
      </g>
      <text x="30" y="380" class="row" style="animation-delay:3s" fill="#ff2d4b" font-size="13">[✓] 6 records loaded · timeline verified</text>
    </g>
  </g>
</svg>
