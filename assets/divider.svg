<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="8" viewBox="0 0 1000 8" fill="none" role="presentation">
  <defs>
    <linearGradient id="d" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff2d4b" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#ff2d4b"/>
      <stop offset="1" stop-color="#ff2d4b" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect x="0" y="3" width="1000" height="2" fill="url(#d)"/>
  <circle cx="0" cy="4" r="3" fill="#ff5d5d">
    <animate attributeName="cx" values="120;880;120" dur="4s" repeatCount="indefinite" keyTimes="0;0.5;1" calcMode="spline" keySplines="0.4 0 0.2 1;0.4 0 0.2 1"/>
    <animate attributeName="opacity" values="0.2;1;0.2" dur="4s" repeatCount="indefinite"/>
  </circle>
</svg>
