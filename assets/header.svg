<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1000" height="260" viewBox="0 0 1000 260" fill="none" role="img" aria-label="Raju Ranjan — Offensive Security">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0a0c"/>
      <stop offset="0.5" stop-color="#0d0f12"/>
      <stop offset="1" stop-color="#050506"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.4" r="0.75">
      <stop offset="0" stop-color="#ff1e3c" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#ff1e3c" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff2d4b"/>
      <stop offset="0.5" stop-color="#ff5d5d"/>
      <stop offset="1" stop-color="#ff2d4b"/>
    </linearGradient>
    <pattern id="grid" width="26" height="26" patternUnits="userSpaceOnUse">
      <path d="M26 0H0V26" fill="none" stroke="#ff1e3c" stroke-opacity="0.06" stroke-width="1"/>
    </pattern>
    <linearGradient id="scan" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff1e3c" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#ff1e3c" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ff1e3c" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="frame"><rect x="0" y="0" width="1000" height="260" rx="14"/></clipPath>
    <style>
      .mono { font-family: 'JetBrains Mono','Fira Code',ui-monospace,Consolas,monospace; }
      .name { font-family: 'JetBrains Mono','Fira Code',ui-monospace,Consolas,monospace; font-weight: 800; }
      .cursor { animation: blink 1s steps(1) infinite; }
      @keyframes blink { 50% { opacity: 0; } }
      .g1 { animation: g1 3.6s steps(1) infinite; }
      .g2 { animation: g2 3.6s steps(1) infinite; }
      @keyframes g1 { 0%,92%,100%{opacity:0;transform:translate(0,0)} 93%{opacity:.9;transform:translate(-3px,1px)} 96%{opacity:.9;transform:translate(2px,-1px)} }
      @keyframes g2 { 0%,90%,100%{opacity:0;transform:translate(0,0)} 91%{opacity:.7;transform:translate(3px,-1px)} 95%{opacity:.7;transform:translate(-2px,1px)} }
      .flick { animation: flick 5s ease-in-out infinite; }
      @keyframes flick { 0%,97%,100%{opacity:1} 98%{opacity:.72} 99%{opacity:.95} }
    </style>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1000" height="260" fill="url(#bg)"/>
    <rect width="1000" height="260" fill="url(#grid)"/>
    <rect width="1000" height="260" fill="url(#glow)"/>

    <!-- animated scan line -->
    <rect x="0" y="0" width="1000" height="70" fill="url(#scan)" opacity="0.5">
      <animate attributeName="y" values="-70;260" dur="4.5s" repeatCount="indefinite"/>
    </rect>

    <!-- top prompt -->
    <text x="40" y="52" class="mono" font-size="17" fill="#5b6570">
      <tspan fill="#ff2d4b">root@raju</tspan><tspan fill="#7d8794">:</tspan><tspan fill="#6ea8fe">~</tspan><tspan fill="#7d8794">#</tspan>
      <tspan fill="#c9d1d9"> ./init --profile</tspan>
      <tspan class="cursor" fill="#ff2d4b">▊</tspan>
    </text>

    <!-- name with glitch clones -->
    <g class="flick">
      <text x="40" y="150" class="name g2" font-size="76" fill="#00e0ff" opacity="0">RAJU RANJAN</text>
      <text x="40" y="150" class="name g1" font-size="76" fill="#ff2d4b">RAJU RANJAN</text>
      <text x="40" y="150" class="name" font-size="76" fill="url(#title)">RAJU RANJAN</text>
    </g>

    <!-- role line -->
    <text x="42" y="188" class="mono" font-size="19" letter-spacing="3" fill="#ff8a8a">
      OFFENSIVE&#160;SECURITY<tspan fill="#4b535c"> // </tspan>RED&#160;TEAM<tspan fill="#4b535c"> // </tspan>BUG&#160;HUNTER
    </text>

    <!-- status tags -->
    <g class="mono" font-size="13.5">
      <rect x="42" y="210" width="150" height="26" rx="5" fill="#12161b" stroke="#ff2d4b" stroke-opacity="0.5"/>
      <circle cx="58" cy="223" r="4" fill="#3fb950"><animate attributeName="opacity" values="1;0.3;1" dur="1.6s" repeatCount="indefinite"/></circle>
      <text x="70" y="228" fill="#c9d1d9">CEH v12 CERTIFIED</text>

      <rect x="204" y="210" width="184" height="26" rx="5" fill="#12161b" stroke="#ff2d4b" stroke-opacity="0.5"/>
      <text x="216" y="228" fill="#c9d1d9">PUBLISHED RESEARCHER</text>

      <rect x="400" y="210" width="196" height="26" rx="5" fill="#12161b" stroke="#ff2d4b" stroke-opacity="0.5"/>
      <text x="412" y="228" fill="#c9d1d9">ANALYST @ QOS TECH</text>
    </g>

    <!-- right side terminal readout -->
    <g class="mono" font-size="13" fill="#3fb950" opacity="0.92">
      <text x="720" y="96">[+] recon ........... <tspan fill="#c9d1d9">done</tspan></text>
      <text x="720" y="118">[+] exploit ......... <tspan fill="#c9d1d9">armed</tspan></text>
      <text x="720" y="140">[+] c2 channel ...... <tspan fill="#c9d1d9">up</tspan></text>
      <text x="720" y="162" fill="#ff2d4b">[!] access ......... <tspan fill="#ffb3b3">GRANTED</tspan></text>
      <text x="720" y="184" fill="#5b6570">// authorized targets only</text>
    </g>

    <rect x="0.5" y="0.5" width="999" height="259" rx="14" fill="none" stroke="#ff2d4b" stroke-opacity="0.35"/>
  </g>
</svg>
