<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="500" viewBox="0 0 1000 500" fill="none" role="img" aria-label="achievements">
  <defs>
    <linearGradient id="awin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0e1116"/><stop offset="1" stop-color="#07090c"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="around"><rect x="8" y="8" width="984" height="484" rx="12"/></clipPath>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
    <style>
      .mono{font-family:'JetBrains Mono','Fira Code',ui-monospace,Consolas,monospace}
      .cur{animation:blink 1s steps(1) infinite}@keyframes blink{50%{opacity:0}}
      .row{opacity:0;transform:translateX(-18px);animation:slidein .55s cubic-bezier(.2,.7,.2,1) forwards}
      @keyframes slidein{to{opacity:1;transform:translateX(0)}}
      .glow{animation:gl 2.4s ease-in-out infinite}@keyframes gl{50%{opacity:.35}}
      .spark circle{animation:tw 2s ease-in-out infinite}@keyframes tw{50%{opacity:.2}}
    </style>
  </defs>

  <rect x="8" y="8" width="984" height="484" rx="12" fill="url(#awin)" stroke="#ff2d4b" stroke-opacity="0.35"/>
  <g clip-path="url(#around)">
    <!-- title bar -->
    <rect x="8" y="8" width="984" height="38" fill="#12161c"/>
    <circle cx="34" cy="27" r="6" fill="#ff5f56"/><circle cx="56" cy="27" r="6" fill="#ffbd2e"/><circle cx="78" cy="27" r="6" fill="#27c93f"/>
    <text x="500" y="32" text-anchor="middle" class="mono" font-size="14" fill="#7d8794">raju@redteam: ~/trophy-room</text>

    <text x="26" y="76" class="mono" font-size="14" fill="#5b6570"><tspan fill="#ff2d4b">➜</tspan> <tspan fill="#c9d1d9">./achievements --list --sort year</tspan><tspan class="cur" fill="#ff2d4b">▊</tspan></text>

    <!-- column labels -->
    <g class="mono" font-size="11.5" fill="#5b6570" letter-spacing="1">
      <text x="96" y="96">ACHIEVEMENT</text>
      <text x="430" y="96">ISSUER / EVENT</text>
      <text x="772" y="96">RESULT</text>
      <text x="922" y="96">YEAR</text>
    </g>
    <line x1="26" y1="104" x2="974" y2="104" stroke="#1f2732"/>

    <!-- ROWS -->
    <!-- row template height 62, first center at 138 -->

    <!-- 1 Published Researcher (teal, doc) -->
    <g class="row" style="animation-delay:.25s">
      <rect x="26" y="112" width="948" height="52" rx="7" fill="#10151b"/>
      <rect x="26" y="112" width="4" height="52" rx="2" fill="#00c2b2"/>
      <circle cx="60" cy="138" r="16" fill="#0c1a1a" stroke="#00c2b2" stroke-width="1.5"/>
      <g stroke="#00c2b2" stroke-width="1.6" fill="none"><rect x="54" y="131" width="12" height="14" rx="1.5"/><line x1="57" y1="135" x2="63" y2="135"/><line x1="57" y1="139" x2="63" y2="139"/></g>
      <text x="96" y="143" class="mono" font-size="15" font-weight="700" fill="#f0f6fc">Published Researcher</text>
      <text x="430" y="143" class="mono" font-size="13" fill="#8b949e">ResearchGate — Web Vulnerabilities Modulation</text>
      <rect x="760" y="126" width="96" height="24" rx="12" fill="#0c1a1a" stroke="#00c2b2" stroke-opacity="0.6"/><text x="808" y="142" text-anchor="middle" class="mono" font-size="12" fill="#5ee6da">Author</text>
      <text x="936" y="143" class="mono" font-size="13" fill="#c9d1d9">2024</text>
    </g>

    <!-- 2 Academic Excellence (gold star) -->
    <g class="row" style="animation-delay:.45s">
      <rect x="26" y="170" width="948" height="52" rx="7" fill="#151109"/>
      <rect x="26" y="170" width="4" height="52" rx="2" fill="#ffd23f"/>
      <circle cx="60" cy="196" r="16" fill="#1a1405" stroke="#ffd23f" stroke-width="1.5"/>
      <circle cx="60" cy="196" r="16" fill="#ffd23f" opacity="0.25" filter="url(#soft)" class="glow"/>
      <path d="M60 187 l2.4 4.9 5.4 .8 -3.9 3.8 .9 5.4 -4.8 -2.5 -4.8 2.5 .9 -5.4 -3.9 -3.8 5.4 -.8 Z" fill="#ffd23f"/>
      <text x="96" y="201" class="mono" font-size="15" font-weight="700" fill="#f0f6fc">Academic Excellence Award</text>
      <text x="430" y="201" class="mono" font-size="13" fill="#8b949e">Chandigarh University</text>
      <rect x="746" y="184" width="124" height="24" rx="12" fill="#1a1405" stroke="#ffd23f" stroke-opacity="0.6"/><text x="808" y="200" text-anchor="middle" class="mono" font-size="12" fill="#ffde6b">Gold Medal</text>
      <text x="936" y="201" class="mono" font-size="13" fill="#c9d1d9">2024</text>
    </g>

    <!-- 3 Grand Finalist (gold trophy) -->
    <g class="row" style="animation-delay:.65s">
      <rect x="26" y="228" width="948" height="52" rx="7" fill="#151109"/>
      <rect x="26" y="228" width="4" height="52" rx="2" fill="#ffd23f"/>
      <circle cx="60" cy="254" r="16" fill="#1a1405" stroke="#ffd23f" stroke-width="1.5"/>
      <g fill="#ffd23f"><path d="M53 247 h14 v3 a7 7 0 0 1 -14 0 Z"/><path d="M52 248 a3 3 0 0 1 0 5 M68 248 a3 3 0 0 0 0 5" fill="none" stroke="#ffd23f" stroke-width="1.4"/><rect x="58" y="256" width="4" height="4"/><rect x="55" y="260" width="10" height="2.5" rx="1"/></g>
      <text x="96" y="259" class="mono" font-size="15" font-weight="700" fill="#f0f6fc">Grand Finalist</text>
      <text x="430" y="259" class="mono" font-size="13" fill="#8b949e">KAVACH National Cybersecurity Hackathon</text>
      <rect x="752" y="242" width="112" height="24" rx="12" fill="#1a1405" stroke="#ffd23f" stroke-opacity="0.6"/><text x="808" y="258" text-anchor="middle" class="mono" font-size="12" fill="#ffde6b">Top 3 teams</text>
      <text x="936" y="259" class="mono" font-size="13" fill="#c9d1d9">2023</text>
    </g>

    <!-- 4 5th Place (silver, number) -->
    <g class="row" style="animation-delay:.85s">
      <rect x="26" y="286" width="948" height="52" rx="7" fill="#101318"/>
      <rect x="26" y="286" width="4" height="52" rx="2" fill="#c0c7d0"/>
      <circle cx="60" cy="312" r="16" fill="#12151a" stroke="#c0c7d0" stroke-width="1.5"/>
      <text x="60" y="317" text-anchor="middle" class="mono" font-size="15" font-weight="700" fill="#c0c7d0">5</text>
      <text x="96" y="317" class="mono" font-size="15" font-weight="700" fill="#f0f6fc">5th Place</text>
      <text x="430" y="317" class="mono" font-size="13" fill="#8b949e">Intel oneAPI Hackathon × IIT Roorkee</text>
      <rect x="768" y="300" width="80" height="24" rx="12" fill="#12151a" stroke="#c0c7d0" stroke-opacity="0.6"/><text x="808" y="316" text-anchor="middle" class="mono" font-size="12" fill="#d5dbe3">Top 5</text>
      <text x="936" y="317" class="mono" font-size="13" fill="#c9d1d9">2023</text>
    </g>

    <!-- 5 2nd Runner-Up (bronze, number) -->
    <g class="row" style="animation-delay:1.05s">
      <rect x="26" y="344" width="948" height="52" rx="7" fill="#160f0a"/>
      <rect x="26" y="344" width="4" height="52" rx="2" fill="#cd7f45"/>
      <circle cx="60" cy="370" r="16" fill="#170f09" stroke="#cd7f45" stroke-width="1.5"/>
      <text x="60" y="375" text-anchor="middle" class="mono" font-size="15" font-weight="700" fill="#e39a63">3</text>
      <text x="96" y="375" class="mono" font-size="15" font-weight="700" fill="#f0f6fc">2nd Runner-Up</text>
      <text x="430" y="375" class="mono" font-size="13" fill="#8b949e">Smart India Hackathon Qualifiers</text>
      <rect x="768" y="358" width="80" height="24" rx="12" fill="#170f09" stroke="#cd7f45" stroke-opacity="0.6"/><text x="808" y="374" text-anchor="middle" class="mono" font-size="12" fill="#e39a63">Top 3</text>
      <text x="936" y="375" class="mono" font-size="13" fill="#c9d1d9">2023</text>
    </g>

    <!-- 6 CEH v12 (red shield) -->
    <g class="row" style="animation-delay:1.25s">
      <rect x="26" y="402" width="948" height="52" rx="7" fill="#170b0e"/>
      <rect x="26" y="402" width="4" height="52" rx="2" fill="#ff2d4b"/>
      <circle cx="60" cy="428" r="16" fill="#1a0a0d" stroke="#ff2d4b" stroke-width="1.5"/>
      <circle cx="60" cy="428" r="16" fill="#ff2d4b" opacity="0.22" filter="url(#soft)" class="glow"/>
      <path d="M60 419 l7 2.4 v5 c0 4.6 -3 7.6 -7 9 -4 -1.4 -7 -4.4 -7 -9 v-5 Z" fill="none" stroke="#ff6b7f" stroke-width="1.6"/><path d="M56.5 428 l2.4 2.4 4.6 -4.8" fill="none" stroke="#ff6b7f" stroke-width="1.6"/>
      <text x="96" y="433" class="mono" font-size="15" font-weight="700" fill="#f0f6fc">CEH v12</text>
      <text x="430" y="433" class="mono" font-size="13" fill="#8b949e">EC-Council</text>
      <rect x="736" y="416" width="144" height="24" rx="12" fill="#1a0a0d" stroke="#ff2d4b" stroke-opacity="0.6"/><text x="808" y="432" text-anchor="middle" class="mono" font-size="12" fill="#ff8a9c">Certified Ethical Hacker</text>
      <text x="936" y="433" class="mono" font-size="13" fill="#c9d1d9">2023</text>
    </g>

    <!-- twinkle sparks -->
    <g class="spark" fill="#ffffff">
      <circle cx="880" cy="130" r="1.4"/><circle cx="900" cy="250" r="1.2"/><circle cx="120" cy="196" r="1.3"/><circle cx="70" cy="428" r="1.4"/>
    </g>

    <!-- one-time light sweep -->
    <rect x="-300" y="8" width="240" height="484" fill="url(#shine)" transform="skewX(-18)">
      <animate attributeName="x" values="-300;1200" dur="2.6s" begin="1.4s" repeatCount="1" fill="freeze"/>
    </rect>
  </g>
</svg>
