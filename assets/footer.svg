<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="150" viewBox="0 0 1000 150" fill="none" role="img" aria-label="logout">
  <defs>
    <linearGradient id="fbg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#07090c"/>
      <stop offset="1" stop-color="#0d0f13"/>
    </linearGradient>
    <linearGradient id="wave" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff2d4b"/>
      <stop offset="1" stop-color="#8a0f20"/>
    </linearGradient>
    <clipPath id="fc"><rect width="1000" height="150" rx="14"/></clipPath>
    <style>.mono{font-family:'JetBrains Mono','Fira Code',ui-monospace,Consolas,monospace}.cur{animation:blink 1s steps(1) infinite}@keyframes blink{50%{opacity:0}}</style>
  </defs>
  <g clip-path="url(#fc)">
    <rect width="1000" height="150" fill="url(#fbg)"/>
    <path fill="url(#wave)" fill-opacity="0.85" d="M0 70 C 150 40, 300 100, 500 70 S 850 40, 1000 70 L1000 150 L0 150 Z">
      <animate attributeName="d" dur="6s" repeatCount="indefinite"
        values="M0 70 C 150 40, 300 100, 500 70 S 850 40, 1000 70 L1000 150 L0 150 Z;
                M0 70 C 150 100, 300 40, 500 70 S 850 100, 1000 70 L1000 150 L0 150 Z;
                M0 70 C 150 40, 300 100, 500 70 S 850 40, 1000 70 L1000 150 L0 150 Z"/>
    </path>
    <text x="500" y="52" text-anchor="middle" class="mono" font-size="18" fill="#c9d1d9">
      <tspan fill="#ff2d4b">root@raju</tspan>:<tspan fill="#6ea8fe">~</tspan># <tspan fill="#ffb3b3">stay secure. hack ethically. logout</tspan><tspan class="cur" fill="#ff2d4b">▊</tspan>
    </text>
  </g>
</svg>
